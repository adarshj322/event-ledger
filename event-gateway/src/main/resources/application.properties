spring.application.name=event-gateway
server.port=8080

# H2 in-memory database (Gateway's own event store, separate from Account Service)
spring.datasource.url=jdbc:h2:mem:gateway;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Account Service connection
account-service.base-url=${ACCOUNT_SERVICE_BASE_URL:http://localhost:8081}
